# Reusable Cobalt CI workflow.

name: main

on:
  workflow_call:
    inputs:
      platform:
        description: 'Cobalt platform.'
        required: true
        type: string
      nightly:
        description: 'Nightly workflow.'
        required: true
        type: string
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.platform }} @ ${{ github.event.label.name || github.event.pull_request.number || github.sha }} @ ${{ github.event.label.name && github.event.pull_request.number || github.event.action }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Retrieves configuration from json file.
  initialize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_REPO_URL: ${{ github.event.pull_request.base.repo.url }}
      GITHUB_EVENT_NUMBER: ${{ github.event.number }}
    if: |
      github.event.action != 'labeled' ||
      github.event.pull_request.merged == false &&
      (
        github.event.action == 'labeled' &&
        github.event.label.name == 'runtest'
      )
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - name: Remove runtest if exists
        if: github.event_name == 'pull_request'
        continue-on-error: true  # Ignore this step if we cannot remove the label.
        run: |
          set +e
          curl \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            ${GITHUB_PR_REPO_URL}/issues/${GITHUB_EVENT_NUMBER}/labels/runtest
        shell: bash
      - id: set-platforms
        shell: bash
        run: |
          platforms=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -c '.platforms')
          echo "platforms=${platforms}" >> $GITHUB_ENV
      - id: set-includes
        shell: bash
        run: |
          includes=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -c '.includes')
          echo "includes=${includes}" >> $GITHUB_ENV
      - id: set-on-device-test
        shell: bash
        run: |
          on_device_test=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -rc '.on_device_test')
          echo "on_device_test=${on_device_test}" >> $GITHUB_ENV
      - id: set-on-device-test-attempts
        shell: bash
        run: |
          on_device_test_attempts=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -rc '.on_device_test.test_attempts // empty')
          echo "on_device_test_attempts=${on_device_test_attempts}" >> $GITHUB_ENV
      - id: set-on-host-test
        shell: bash
        run: |
          on_host_test=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -rc '.on_host_test')
          echo "on_host_test=${on_host_test}" >> $GITHUB_ENV
      - id: set-on-host-test-shards
        shell: bash
        run: |
          on_host_test_shards=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -c '.on_host_test_shards')
          echo "on_host_test_shards=${on_host_test_shards}" >> $GITHUB_ENV
      - id: set-on-host-test-evergreen-loader
        shell: bash
        run: |
          evergreen_loader=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -rc '.evergreen_loader')
          echo "evergreen_loader=${evergreen_loader}" >> $GITHUB_ENV
      - id: set-docker-service
        shell: bash
        run: |
          docker_service=$(cat ${GITHUB_WORKSPACE}/.github/config/${{ inputs.platform }}.json | jq -r '.docker_service')
          echo "docker_service=${docker_service}" >> $GITHUB_ENV
    outputs:
      platforms: ${{ env.platforms }}
      includes: ${{ env.includes }}
      on_device_test: ${{ env.on_device_test }}
      on_device_test_attempts: ${{ env.on_device_test_attempts }}
      on_host_test: ${{ env.on_host_test }}
      on_host_test_shards: ${{ env.on_host_test_shards }}
      evergreen_loader: ${{ env.evergreen_loader }}
      docker_service: ${{ env.docker_service }}

  # Builds, tags, and pushes Cobalt docker build images to ghr.
  docker-build-image:
    needs: [initialize]
    runs-on: ubuntu-latest
    env:
      docker_tag: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Pull just in case
      run: docker pull ghcr.io/${{ github.repository }}/linux || true
    - name: Build containers using docker compose
      run: docker compose build linux
    - name: Re-tag
      run: |
        tag=${{ env.docker_tag }}
        tag=${tag//\//__}
        echo "docker_tag=${tag}" | head -n 1 >> $GITHUB_ENV
        docker tag ghcr.io/${{ github.repository }}/linux:latest ghcr.io/${{ github.repository }}/linux:${tag}
    - name: Work
      run: docker push ghcr.io/${{ github.repository }}/linux:${{ env.docker_tag }}
    outputs:
      docker_tag: ghcr.io/${{ github.repository }}/linux:${{ env.docker_tag }}

  # Runs builds.
  build:
    needs: [docker-build-image]
    runs-on: [self-hosted, chrobalt-linux-runner]
    container: ${{ needs.docker-build-image.outputs.docker_tag }}
    env:
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      SCCACHE: 1
      SCCACHE_GCS_BUCKET: cobalt-actions-sccache-linux
      SCCACHE_GCS_SERVICE_ACCOUNT: runner@cobalt-actions-devel.iam.gserviceaccount.com
      SCCACHE_GCS_RW_MODE: READ_WRITE
      SCCACHE_IDLE_TIMEOUT: 0 # prevent sccache server from shutting down after long idle.
      BUILD_DIR: out/linux-x64x11_qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src
      - name: Get depot tools
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      - name: Add directory to PATH
        run: echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
      - name: Generate gclient file
        run: gclient config --name=src https://github.com/${{ github.repository }}
      - name: Gclient sync
        run: gclient sync -v --shallow --no-history -r ${{ github.sha }}
      - name: DF
        run: df -h
      - name: Du
        run: du -ht 500M
      - name: sccache check
        run: sccache -s
      - name: gn gen
        run: |
          cd src
          chrobalt/build/gn.py -p linux-x64x11 -C qa --no-check
      - name: gn dump args
        run: |
          cd src
          gn args --list --short ${BUILD_DIR}
      - name: ninja base_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} base_unittests
      - name: ninja sql_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} sql_unittests
      - name: ninja net_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} net_unittests
      - name: ninja url_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} url_unittests
      - name: ninja ipc_tests
        run: |
          cd src
          ninja -C ${BUILD_DIR} ipc_tests
      - name: ninja mojo_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} mojo_unittests
      - name: ninja gpu_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} gpu_unittests
      - name: ninja gin_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} gin_unittests
      - name: ninja blink_unittests
        run: |
          cd src
          ninja -C ${BUILD_DIR} blink_unittests
      - name: ninja content_shell
        run: |
          cd src
          ninja -C ${BUILD_DIR} content_shell
      - name: sccache check
        run: sccache -s
      - name: Any speed
        run: echo Any speed
